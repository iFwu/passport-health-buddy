<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Buddy 固件预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#1c252a;font-family:system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 20px}h2{font-size:17px;margin:28px 0 12px}.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}figure{margin:0}figure img{width:240px;height:320px;display:block;image-rendering:pixelated}figcaption{font-size:14px;padding:8px 0}.audio{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}audio{width:100%}label{display:block;font-size:14px;margin-bottom:6px}
</style>
<main><h1>Health Buddy：实际 LVGL 渲染与固件音效</h1><p>桌面渲染，非真机截图。音频由固件的定点合成器导出；电脑播放不代表设备声压。上下短按调音量、长按翻页；确认短按执行、长按说话。</p><div class="screens">
<figure><img src="office.png" alt="办公"><figcaption>办公：确认记水</figcaption></figure>
<figure><img src="gym.png" alt="健身"><figcaption>健身：确认休息</figcaption></figure>
<figure><img src="home.png" alt="平板支撑"><figcaption>居家默认：平板支撑自由计时</figcaption></figure>
<figure><img src="home-squat.png" alt="深蹲"><figcaption>深蹲：30 秒运动 / 20 秒休息，共 3 轮</figcaption></figure>
<figure><img src="home-jacks.png" alt="开合跳"><figcaption>开合跳：30 秒运动 / 20 秒休息，共 3 轮</figcaption></figure>
<figure><img src="home-stretch.png" alt="舒展拉伸"><figcaption>拉伸：40 秒运动 / 10 秒休息，共 3 轮</figcaption></figure>
<figure><img src="help.png" alt="按键帮助"><figcaption>长按上下翻到 ?，确认返回</figcaption></figure>
<figure><img src="home-volume-recording.png" alt="居家音量和录音反馈"><figcaption>全局音量与语音反馈</figcaption></figure>
<figure><img src="running-under-minute.png" alt="59.99 秒"><figcaption>59.99 秒</figcaption></figure>
<figure><img src="running-over-minute.png" alt="1 分钟"><figcaption>1 分钟</figcaption></figure>
<figure><img src="running-narrow-digits.png" alt="11.11 秒"><figcaption>11.11 秒</figcaption></figure>
<figure><img src="running-seven.png" alt="17.07 秒"><figcaption>17.07 秒</figcaption></figure>
<figure><img src="preparing.png" alt="准备"><figcaption>准备</figcaption></figure>
<figure><img src="starting.png" alt="开始信号"><figcaption>0：开始信号</figcaption></figure>
<figure><img src="ready.png" alt="等待开始"><figcaption>等待开始</figcaption></figure>
<figure><img src="history.png" alt="最近记录"><figcaption>最近记录</figcaption></figure>
</div><h2>提示音</h2><div class="audio">
<div><label for="prep">准备与开始</label><audio id="prep" controls preload="none" src="preparation.wav"></audio></div>
<div><label for="ten">10 秒</label><audio id="ten" controls preload="none" src="ten.wav"></audio></div>
<div><label for="thirty">30 秒</label><audio id="thirty" controls preload="none" src="thirty.wav"></audio></div>
<div><label for="minute">整分钟</label><audio id="minute" controls preload="none" src="minute.wav"></audio></div>
<div><label for="stop">结束</label><audio id="stop" controls preload="none" src="stop.wav"></audio></div>
<div><label for="relax">转入休息</label><audio id="relax" controls preload="none" src="relax.wav"></audio></div>
<div><label for="finish">全部完成</label><audio id="finish" controls preload="none" src="finish.wav"></audio></div>
<div><label for="remind">活动 / 喝水提醒</label><audio id="remind" controls preload="none" src="remind.wav"></audio></div>
<div><label for="ok">已记录</label><audio id="ok" controls preload="none" src="ok.wav"></audio></div>
<div><label for="vol">音量反馈</label><audio id="vol" controls preload="none" src="vol.wav"></audio></div>
<div><label for="listen">开始听</label><audio id="listen" controls preload="none" src="listen.wav"></audio></div>
<div><label for="sent">已发送</label><audio id="sent" controls preload="none" src="sent.wav"></audio></div>
<div><label for="error">失败</label><audio id="error" controls preload="none" src="error.wav"></audio></div>
</div></main>
</html>
